[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-dish"
version = "0.1.0"
description = "Let's cultivate your AI agents: watch Claude Code, Cowork, Kiro, Antigravity, Gemini and Codex sessions grow as living cells in a petri dish."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []          # standard library only
keywords = ["claude-code", "claude-cowork", "kiro", "codex", "gemini-cli", "antigravity", "visualization", "agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agent-dish = "agent_dish.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_dish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
