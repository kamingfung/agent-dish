[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-cells"
version = "0.1.0"
description = "Watch your AI coding-agent sessions (Claude Code, Kiro, Antigravity, Codex) grow as living cells in a petri dish."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []          # standard library only
keywords = ["claude-code", "kiro", "codex", "antigravity", "visualization", "agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
session-cells = "session_cells.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_cells"]

[tool.pytest.ini_options]
testpaths = ["tests"]
