name: release
# Publish a release on GitHub (the web page or `gh release create`) with a tag that is v + the version, e.g. v2026.11.24.
# This checks the tag matches the version, runs the tests, builds, and attaches the wheel, sdist and agent-dish.pyz to that
# release. PyPI is a separate job that stays off until you opt in (see docs/releasing.md).
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only this job may attach files to the release
    env:
      TAG: ${{ github.event.release.tag_name }} # read through the environment, never pasted into a shell command
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false # a release is built from a clean slate, never from a cache a pull request could have written
          version: "0.13.9"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just release-check "$TAG"
      - run: uv sync --locked
      - run: just test
      - run: just build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
      - name: attach the files, and fill in empty release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/* dist-zipapp/agent-dish.pyz --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            awk -v t="${TAG#v}" '$0 ~ "^## "t"( |$)"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
            [ -s notes.md ] && gh release edit "$TAG" --notes-file notes.md
          fi
  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true' # off until you set this repository variable
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # PyPI "trusted publishing": no token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
