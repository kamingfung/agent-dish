name: ci
# CI only calls `just`, so it runs exactly what you run locally (see the justfile).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check (hooks and history scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secrets scan reads the whole history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: just install-gitleaks
      - run: uv sync --locked
      - run: just hooks secrets
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: just test-on ${{ matrix.python }}
