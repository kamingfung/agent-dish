# Run by `just setup` on every commit (and tests on push), and by CI through `just hooks`.
# Update the pinned versions with `pre-commit autoupdate`.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=4096"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.10.1"]
        types_or: [markdown, yaml, json, javascript]
        exclude: ^(uv\.lock|docs/media/)
      - id: no-sensitive-info
        name: no personal paths, emails or private terms
        entry: python3 scripts/check_sensitive.py
        language: system
        types: [text]
        exclude: ^uv\.lock$
      - id: tests
        name: tests (on push)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
